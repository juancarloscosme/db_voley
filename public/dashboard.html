<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Club Vóley</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- LIBRERÍA PARA LOS GRÁFICOS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>🏐 Panel de Control</h1>
    <div>
      <span id="user-info"></span>
      <button onclick="logout()">Salir</button>
    </div>
  </header>

  <nav>
    <button onclick="mostrar('pagos')">💰 Ingresos</button>
    <button onclick="mostrar('inventario')">📦 Inventario</button>
    <button onclick="mostrar('clases')">📅 Clases</button>
    <button id="btn-usuarios" class="oculto" onclick="mostrar('usuarios')">👥 Usuarios</button>
    <button onclick="mostrar('asistencias')">✅ Asistencias</button>
  </nav>

  <main>
    <!-- SECCIÓN DE PAGOS -->
    <section id="pagos" class="seccion">
      <h2>💰 Control de Ingresos</h2>
      
      <!-- BARRA DE HERRAMIENTAS -->
      <div style="display: flex; gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ddd; flex-wrap: wrap;">
        <input type="text" id="buscar_pago" placeholder="🔍 Buscar por jugador o concepto..." oninput="cargarPagos()" style="flex: 1; margin: 0; min-width: 200px;">
        
        <select id="filtro_estado" onchange="cargarPagos()" style="margin: 0;">
          <option value="todos">Todos los estados</option>
          <option value="pendiente">Solo Pendientes</option>
          <option value="pagado">Solo Pagados</option>
        </select>

        <select id="filtro_mes" onchange="cargarPagos()" style="margin: 0;">
          <option value="todos">Todos los meses</option>
          <option value="0">Enero</option>
          <option value="1">Febrero</option>
          <option value="2">Marzo</option>
          <option value="3">Abril</option>
          <option value="4">Mayo</option>
          <option value="5">Junio</option>
          <option value="6">Julio</option>
          <option value="7">Agosto</option>
          <option value="8">Septiembre</option>
          <option value="9">Octubre</option>
          <option value="10">Noviembre</option>
          <option value="11">Diciembre</option>
        </select>

        <select id="filtro_anio" onchange="cargarPagos()" style="margin: 0;">
          <option value="todos">Todos los años</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
        </select>
        <button onclick="descargarExcel()" style="background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
          📊 Excel
        </button>
        <button onclick="descargarPDF()" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
          📄 PDF
        </button>
      </div>

      <!-- BOTÓN PARA VER GRÁFICOS -->
      <div style="margin-bottom: 20px;">
        <button onclick="mostrarGraficos()" style="background: #8e44ad; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
          📈 Ver Dashboard de Métricas
        </button>
      </div>

      <!-- CONTENEDOR DEL GRÁFICO (Oculto por defecto) -->
      <div id="contenedor-graficos" class="oculto" style="background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd;">
        <h3>Estadísticas Visuales</h3>
        <canvas id="miGrafico" height="80"></canvas>
      </div>

      <div id="resumen-pagos" class="stats"></div>
      
      <h3>Registrar pago</h3>
      <select id="pago_jugador">
        <option value="">Cargando jugadores...</option>
      </select>
      
      <!-- CAMPO CON SUGERENCIAS DE CLASES -->
      <input list="lista-clases-concepto" id="pago_concepto" placeholder="Concepto (o elige una clase)">
      <datalist id="lista-clases-concepto"></datalist>

      <input id="pago_monto" type="number" placeholder="Monto S/">
    
      <label style="font-size: 0.9em; margin-left: 5px;">Inicio:</label>
      <input id="pago_fecha_inicio" type="date" style="width: 130px;">

      <input id="pago_duracion" type="number" placeholder="Duración" style="width: 80px;" min="1">
      <select id="pago_tipo_duracion">
        <option value="dias">Días</option>
        <option value="meses" selected>Meses</option>
        <option value="anios">Años</option>
      </select>

      <button onclick="crearPago()">Registrar</button>
      <div id="lista-pagos"></div>
    </section> <!-- ¡AQUÍ FALTABA CERRAR LA SECCIÓN DE PAGOS! -->
    
    <!-- SECCIÓN DE INVENTARIO -->
    <section id="inventario" class="seccion oculto">
      <h2>📦 Inventario</h2>
      
      <!-- BARRA DE FILTROS Y REPORTES -->
      <div style="display: flex; gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ddd; flex-wrap: wrap;">
        <input type="text" id="buscar_inv" placeholder="🔍 Buscar item..." oninput="cargarInventario()" style="flex: 1; margin: 0;">
        
        <select id="filtro_cat" onchange="cargarInventario()" style="margin: 0;">
          <option value="todos">Todas las categorías</option>
          <option value="Balón">Balones</option>
          <option value="Red">Redes</option>
          <option value="Uniforme">Uniformes</option>
          <option value="Conos">Conos</option>
        </select>

        <input type="month" id="filtro_mes_inv" onchange="cargarInventario()" style="margin: 0;">

        <button onclick="descargarExcelInventario()" style="background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
          📊 Excel
        </button>
        <button onclick="descargarPDFInventario()" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
          📄 PDF
        </button>
      </div>

      <h3>Registrar nuevo item</h3>
      <input id="inv_item" placeholder="Item (balón)">
      <input id="inv_cat" placeholder="Categoría">
      <input id="inv_cant" type="number" placeholder="Cantidad">
      
      <!-- NUEVOS CAMPOS -->
      <input id="inv_proveedor" placeholder="Proveedor / Donante">
      <input id="inv_fecha_ingreso" type="date" title="Fecha de ingreso">
      
      <select id="inv_estado">
        <option value="nuevo">Nuevo</option>
        <option value="uso">En uso</option>
        <option value="dañado">Dañado</option>
      </select>
      <input id="inv_vida" type="number" placeholder="Vida útil (meses)">
      
      <!-- BOTONES DINÁMICOS PARA CREAR/EDITAR -->
      <button id="btn-guardar-item" onclick="guardarItem()">Agregar</button>
      <button id="btn-cancelar-item" class="oculto" onclick="cancelarEdicionItem()" style="background: #95a5a6; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer;">Cancelar</button>
      
      <div id="lista-inventario"></div>
    </section>

    <!-- SECCIÓN DE CLASES -->
    <section id="clases" class="seccion oculto">
      <h2>📅 Clases</h2>
      <input id="cl_nombre" placeholder="Nombre clase">
      <input id="cl_cat" placeholder="Categoría (Sub-15)">
      <input id="cl_dia" placeholder="Día (Lunes)">
      <input id="cl_ini" type="time">
      <input id="cl_fin" type="time">
      <input id="cl_cancha" placeholder="Cancha">
      <button onclick="crearClase()">Crear</button>
      <div id="lista-clases"></div>
    </section>

    <!-- SECCIÓN DE USUARIOS -->
    <section id="usuarios" class="seccion oculto">
      <h2>👥 Usuarios</h2>
      
      <h3>Crear nuevo usuario</h3>
      <input id="usr_nombre" placeholder="Nombre completo">
      <input id="usr_email" type="email" placeholder="Correo">
      <input id="usr_pass" type="password" placeholder="Contraseña">
      <select id="usr_rol">
        <option value="jugador">Jugador</option>
        <option value="entrenador">Entrenador</option>
        <option value="cajero">Cajero</option>
        <option value="admin">Administrador</option>
      </select>
      <button onclick="crearUsuario()">Crear Usuario</button>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      
      <h3>Lista de Usuarios</h3>
      <div id="lista-usuarios"></div>
    </section>

    <!-- SECCIÓN DE ASISTENCIAS -->
    <section id="asistencias" class="seccion oculto">
      <h2>✅ Control de Asistencias</h2>
      
      <!-- FILTROS -->
      <!-- FILTROS -->
      <div style="display: flex; gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ddd; flex-wrap: wrap;">
        <select id="asis_clase" onchange="cargarAsistencias()" style="margin: 0;">
          <option value="">Seleccione una clase</option>
        </select>

        <select id="asis_mes" onchange="cargarAsistencias()" style="margin: 0;">
          <option value="todos">Todos los meses</option>
          <option value="0">Enero</option>
          <option value="1">Febrero</option>
          <option value="2">Marzo</option>
          <option value="3">Abril</option>
          <option value="4">Mayo</option>
          <option value="5">Junio</option>
          <option value="6">Julio</option>
          <option value="7">Agosto</option>
          <option value="8">Septiembre</option>
          <option value="9">Octubre</option>
          <option value="10">Noviembre</option>
          <option value="11">Diciembre</option>
        </select>

        <!-- NUEVO FILTRO DE ESTADO -->
        <select id="asis_filtro_estado" onchange="cargarAsistencias()" style="margin: 0;">
          <option value="todos">Todos (Presentes y Faltas)</option>
          <option value="1">Solo Presentes</option>
          <option value="0">Solo Faltas</option>
        </select>

        <!-- NUEVO BOTÓN DE PDF -->
        <button onclick="descargarPDFAsistencias()" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
          📄 Reporte PDF
        </button>
      </div>

      <!-- NUEVO RESUMEN (Se llenará con JS) -->
      <div id="resumen-asistencias" style="margin-bottom: 20px; font-weight: bold; color: #1f4e79;"></div>

      <!-- FORMULARIO PARA MARCAR ASISTENCIA -->
      <h3>Registrar Asistencia</h3>
      <input type="date" id="asis_fecha" style="width: 150px;">
      <select id="asis_jugador">
        <option value="">Seleccione un jugador</option>
      </select>
      <select id="asis_estado">
        <option value="1">Presente</option>
        <option value="0">Falta</option>
      </select>
      <button onclick="marcarAsistencia()">Guardar Asistencia</button>

      <!-- LISTA DE ASISTENCIAS -->
      <h3>Historial de la clase</h3>
      <div id="lista-asistencias"></div>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
